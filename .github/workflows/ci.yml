name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build & static export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (static export)
        run: npm run build

      - name: Verify export output
        run: test -f out/index.html && echo "Static export OK"

      - name: Upload export artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-export
          path: out
          retention-days: 7
